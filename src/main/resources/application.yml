spring:
  application:
    name: gateway
  config:
    import: optional:configserver:http://127.0.0.1:8888
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://localhost:3000
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: smoke-health
              uri: forward:/actuator/health
              predicates:
                - Path=/api/smoke
            - id: users-api
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
